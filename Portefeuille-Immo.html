// Lit les champs déjà saisis dans le formulaire — pas besoin d'avoir
// enregistré le bien au préalable, la génération marche dès qu'il y a de quoi
// écrire quelque chose de vrai.
function collecterChampsPourDescription(){
  const type = document.getElementById('f_type').value;
  const operation = document.getElementById('f_operation').value;
  const champs = {
    type, operation,
    statut_foncier: document.getElementById('f_statut_foncier').value,
    commune: document.getElementById('f_commune').value.trim(),
    region: document.getElementById('f_region').value.trim(),
    quartier: document.getElementById('f_quartier').value.trim(),
    surface: document.getElementById('f_surface').value,
    price: document.getElementById('f_price').value,
  };
  const equipEl = document.getElementById('f_equip');
  champs.equipements = equipEl ? equipEl.value.split(',').map(s=>s.trim()).filter(Boolean) : [];
  if(type !== 'Terrain' && type !== 'Champ agricole'){
    champs.chambres = document.getElementById('f_chambres').value || null;
    champs.salons = document.getElementById('f_salons').value || null;
    champs.salles_bain = document.getElementById('f_sdb').value || null;
    champs.cuisine = document.getElementById('f_cuisine').value || null;
  }
  return champs;
}

async function genererDescriptionIA(){
  const btn = document.getElementById('f_descIA');
  const errEl = document.getElementById('f_descIAError');
  errEl.textContent = '';
  const champs = collecterChampsPourDescription();
  if(!champs.commune || !champs.surface || !champs.price){
    errEl.textContent = 'Renseignez au moins la commune, la superficie et le prix avant de générer.';
    return;
  }
  const original = btn.textContent;
  btn.disabled = true;
  btn.textContent = 'Génération…';
  const { data, error } = await db.functions.invoke('generer-description', { body: champs });
  btn.disabled = false;
  btn.textContent = original;
  if(error){
    let detail = error.message || 'Erreur inconnue.';
    if(error.context && typeof error.context.json === 'function'){
      try{ const corps = await error.context.json(); if(corps?.erreur) detail = corps.erreur; } catch{}
    }
    errEl.textContent = 'La génération a échoué : ' + detail;
    return;
  }
  document.getElementById('f_desc').value = data?.description || '';
}

async function saveProperty(existing){
  const errEl = document.getElementById('formError');
  errEl.textContent = '';

  const type = document.getElementById('f_type').value;
  const operation = document.getElementById('f_operation').value;
  const payload = {
    ref: document.getElementById('f_ref').value.trim(),
    type, operation,
    status: document.getElementById('f_status').value,
    statut_foncier: document.getElementById('f_statut_foncier').value,
    commune: document.getElementById('f_commune').value.trim(),
    region: document.getElementById('f_region').value.trim(),
    departement: document.getElementById('f_departement').value.trim(),
    quartier: document.getElementById('f_quartier').value.trim() || null,
    lat: parseFloat(document.getElementById('f_lat').value),
    lng: parseFloat(document.getElementById('f_lng').value),
    surface: parseFloat(document.getElementById('f_surface').value),
    price: parseFloat(document.getElementById('f_price').value),
    description: document.getElementById('f_desc').value.trim() || null,
    is_published: document.getElementById('f_published').checked,
    date_disponibilite: document.getElementById('f_date_dispo').value || null,
    chambres: null, salons: null, salles_bain: null, cuisine: null, equipements: null,
    etage: null, annee_construction: null, meuble: null, charges: null, caution: null
  };
  if(!existing){
    payload.date_acquisition = new Date().toISOString().slice(0, 10);
  }

  if(!payload.ref || !payload.commune || !payload.region || !payload.departement || isNaN(payload.lat) || isNaN(payload.lng) || isNaN(payload.surface) || isNaN(payload.price)){
    errEl.textContent = 'Merci de renseigner tous les champs obligatoires (référence, commune, région, département, latitude, longitude, superficie, prix).';
    return;
  }

  if(type !== 'Terrain' && type !== 'Champ agricole'){
    const chambres = document.getElementById('f_chambres').value;
    const salons = document.getElementById('f_salons').value;
    const sdb = document.getElementById('f_sdb').value;
    payload.chambres = chambres ? parseInt(chambres) : null;
    payload.salons = salons ? parseInt(salons) : null;
    payload.salles_bain = sdb ? parseInt(sdb) : null;
    payload.cuisine = document.getElementById('f_cuisine').value;
    const annee = document.getElementById('f_annee').value;
    payload.annee_construction = annee ? parseInt(annee) : null;
    const etageEl = document.getElementById('f_etage');
    if(etageEl) payload.etage = etageEl.value.trim() || null;
  }
  const equipEl = document.getElementById('f_equip');
  if(equipEl){
    const equip = equipEl.value;
    payload.equipements = equip ? equip.split(',').map(e=>e.trim()).filter(Boolean) : null;
  }
  const meubleEl = document.getElementById('f_meuble');
  if(meubleEl){
    payload.meuble = meubleEl.value === 'Meublé' ? true : meubleEl.value === 'Non meublé' ? false : null;
    const charges = document.getElementById('f_charges').value;
    const caution = document.getElementById('f_caution').value;
    payload.charges = charges ? parseFloat(charges) : null;
    payload.caution = caution ? parseFloat(caution) : null;
  }

  const saveBtn = document.getElementById('formSave');
  saveBtn.disabled = true;
  saveBtn.textContent = 'Enregistrement…';

  let propertyId;
  if(existing){
    const { data, error } = await db.from('properties').update(payload).eq('id', existing.id).select().single();
    if(error){ errEl.textContent = "Échec de l'enregistrement : " + error.message; saveBtn.disabled=false; saveBtn.textContent='Enregistrer les modifications'; return; }
    propertyId = data.id;
  } else {
    const { data, error } = await db.from('properties').insert(payload).select().single();
    if(error){ errEl.textContent = "Échec de l'enregistrement : " + error.message; saveBtn.disabled=false; saveBtn.textContent='Ajouter ce bien'; return; }
    propertyId = data.id;
  }

  if(pendingFiles.length){
    const hadNoPhotos = editingPhotos.length === 0;
    let photoErrors = [];
    for(let i=0;i<pendingFiles.length;i++){
      const file = pendingFiles[i].file;
      const safeName = file.name
        .normalize('NFD').replace(/[\u0300-\u036f]/g, '')   // enlève les accents
        .replace(/[^a-zA-Z0-9.\-_]/g, '_');                  // remplace espaces/parenthèses/etc.
      const path = `${propertyId}/${Date.now()}-${i}-${safeName}`;
      const { error: upErr } = await db.storage.from('property-photos').upload(path, file);
      if(upErr){
        console.error('Upload photo échoué:', upErr);
        photoErrors.push(`${file.name}: ${upErr.message}`);
        continue;
      }
      const { error: insertErr } = await db.from('property_photos').insert({
        property_id: propertyId,
        storage_path: path,
        position: editingPhotos.length + i,
        is_cover: hadNoPhotos && i===0
      });
      if(insertErr){
        console.error('Insertion métadonnée photo échouée:', insertErr);
        photoErrors.push(`Métadonnée de ${file.name}: ${insertErr.message}`);
      }
    }
    if(photoErrors.length){
      // Le bien est bien enregistré ; seules certaines photos ont échoué.
      // On referme quand même (pas de renvoi en double possible) et on alerte clairement.
      alert("Le bien a été enregistré, mais certaines photos n'ont pas pu être importées :\n\n" + photoErrors.join('\n') + "\n\nVous pouvez réessayer de les ajouter via 'Modifier'.");
    }
  }

  closeForm();
  await loadProperties();
}

let calendarMonth = (() => { const d = new Date(); d.setDate(1); d.setHours(0,0,0,0); return d; })();
let selectedCalendarDay = null; // 'YYYY-MM-DD'

function fmtDate(iso){
  return new Date(iso).toLocaleDateString('fr-FR', { day:'2-digit', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit' });
}
// Date "AAAA-MM-JJ" (colonne date) affichée sans décalage de fuseau : on force
// l'interprétation en heure locale plutôt qu'en UTC (sinon un jour peut sauter).
function localDateStr(d){
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function fmtDateOnly(dateStr){
  if(!dateStr) return '';
  return new Date(dateStr + 'T00:00:00').toLocaleDateString('fr-FR');
}

// Vérifie si un texte de recherche apparaît dans un ensemble de champs
// (nom, contact, message, référence du bien...), insensible à la casse et aux accents.
function matchesInboxSearch(fields){
  if(!inboxSearch.trim()) return true;
  const norm = s => String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
  const q = norm(inboxSearch);
  return fields.some(f => norm(f).includes(q));
}

async function loadInboxCounts(){
  const [{ count: unreadMsgs }, { count: pendingRdv }] = await Promise.all([
    db.from('contact_messages').select('id', { count:'exact', head:true }).eq('is_read', false),
    db.from('appointments').select('id', { count:'exact', head:true }).eq('status', 'En attente')
  ]);
  const total = (unreadMsgs||0) + (pendingRdv||0);
  const badge = document.getElementById('inboxBadge');
  if(total > 0){ badge.style.display='flex'; badge.textContent = total; } else { badge.style.display='none'; }
}

async function loadInboxData(){
  const [{data:msgs}, {data:apts}, {data:alerts}] = await Promise.all([
    db.from('contact_messages').select('*, properties(ref, commune, type)').order('created_at', {ascending:false}),
    db.from('appointments').select('*, properties(ref, commune, type)').order('created_at', {ascending:false}),
    db.from('alert_subscriptions').select('*').order('created_at', {ascending:false})
  ]);
  INBOX.messages = msgs || [];
  INBOX.appointments = apts || [];
  INBOX.alerts = alerts || [];
}

const RDV_STATUS_COLOR = { 'En attente':'#B8842A', 'Confirmé':'#16A34A', 'Réalisée':'#0F2747', 'Annulé':'#8B9199' };

// Rendu réutilisable d'une liste de RDV (vue Liste ET détail du jour sélectionné en vue Calendrier)
function renderRdvItems(container, items){
  if(!items.length){ container.innerHTML = '<div class="inbox-empty">Aucune demande de rendez-vous.</div>'; return; }
  container.innerHTML = items.map(a => `
    <div class="inbox-item" data-id="${a.id}">
      <div class="ii-top"><span class="ii-name">${esc(a.name)}</span><span class="ii-date">${fmtDate(a.created_at)}</span></div>
      <div class="ii-contact">${esc(a.contact)}</div>
      ${a.properties ? `<div class="ii-ref">Bien : ${esc(a.properties.ref)} — ${a.properties.type}, ${esc(a.properties.commune)}</div>` : ''}
      <div class="ii-body">Le ${fmtDateOnly(a.preferred_date)} · ${esc(a.preferred_time||'')}${a.message ? ' — '+esc(a.message) : ''}</div>
      <div class="ii-actions">
        <select data-action="status">
          <option value="En attente" ${a.status==='En attente'?'selected':''}>En attente</option>
          <option value="Confirmé" ${a.status==='Confirmé'?'selected':''}>Confirmé</option>
          <option value="Réalisée" ${a.status==='Réalisée'?'selected':''}>Réalisée</option>
          <option value="Annulé" ${a.status==='Annulé'?'selected':''}>Annulé</option>
        </select>
        <button data-action="delete">Supprimer</button>
      </div>
    </div>`).join('');
  container.querySelectorAll('[data-action="status"]').forEach(sel=>{
    sel.onchange = async (e) => {
      const id = e.target.closest('.inbox-item').dataset.id;
      await db.from('appointments').update({ status: e.target.value }).eq('id', id);
      const a = INBOX.appointments.find(x=>String(x.id)===id);
      if(a) a.status = e.target.value;
      loadInboxCounts();
      renderInboxList();   // rafraîchit filtre + couleurs en vue Liste ET Calendrier
    };
  });
  container.querySelectorAll('[data-action="delete"]').forEach(btn=>{
    btn.onclick = async (e) => {
      const id = e.target.closest('.inbox-item').dataset.id;
      if(!confirm('Supprimer cette demande de RDV ?')) return;
      await db.from('appointments').delete().eq('id', id);
      INBOX.appointments = INBOX.appointments.filter(x=>String(x.id)!==id);
      loadInboxCounts();
      renderInboxList();
    };
  });
}

function renderRdvCalendar(container){
  const year = calendarMonth.getFullYear();
  const month = calendarMonth.getMonth();
  const startOffset = (new Date(year, month, 1).getDay() + 6) % 7; // lundi en premier
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const todayStr = localDateStr(new Date());

  const byDay = {};
  rdvFilteredItems.forEach(a => { (byDay[a.preferred_date] ||= []).push(a); });

  const monthLabel = calendarMonth.toLocaleDateString('fr-FR', { month:'long', year:'numeric' });

  let cellsHtml = '';
  for(let i=0;i<startOffset;i++){ cellsHtml += `<div class="cal-day muted"></div>`; }
  for(let day=1; day<=daysInMonth; day++){
    const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
    const apts = byDay[dateStr] || [];
    cellsHtml += `
      <div class="cal-day ${dateStr===todayStr?'today':''} ${dateStr===selectedCalendarDay?'selected':''}" data-date="${dateStr}">
        <span class="cal-day-num">${day}</span>
        ${apts.length ? `<div class="cal-day-apts">
          ${apts.slice(0,2).map(a=>`<span class="cal-apt-chip" style="background:${RDV_STATUS_COLOR[a.status]}22;color:${RDV_STATUS_COLOR[a.status]}">${esc((a.name||'').split(' ')[0])}</span>`).join('')}
          ${apts.length>2?`<span class="cal-apt-more">+${apts.length-2}</span>`:''}
        </div>` : ''}
      </div>`;
  }

  container.innerHTML = `
    <div class="cal-toolbar">
      <button type="button" class="cal-nav" data-nav="-1">‹</button>
      <span class="cal-month-label">${monthLabel}</span>
      <button type="button" class="cal-nav" data-nav="1">›</button>
      <button type="button" class="cal-today-btn" id="calTodayBtn">Aujourd'hui</button>
    </div>
    <div class="cal-grid">
      <div class="cal-dow">L</div><div class="cal-dow">M</div><div class="cal-dow">M</div><div class="cal-dow">J</div><div class="cal-dow">V</div><div class="cal-dow">S</div><div class="cal-dow">D</div>
      ${cellsHtml}
    </div>
    <div class="section-title" style="margin-top:16px;">${selectedCalendarDay ? new Date(selectedCalendarDay+'T00:00:00').toLocaleDateString('fr-FR', {weekday:'long', day:'numeric', month:'long'}) : 'Cliquez un jour pour voir le détail'}</div>
    <div id="calDayDetail"></div>`;

  container.querySelectorAll('[data-nav]').forEach(btn=>{
    btn.onclick = () => { calendarMonth = new Date(year, month + Number(btn.dataset.nav), 1); renderRdvCalendar(container); };
  });
  document.getElementById('calTodayBtn').onclick = () => {
    const d = new Date(); d.setDate(1); d.setHours(0,0,0,0);
    calendarMonth = d;
    selectedCalendarDay = localDateStr(new Date());
    renderRdvCalendar(container);
  };
  container.querySelectorAll('.cal-day[data-date]').forEach(cell=>{
    cell.onclick = () => {
      selectedCalendarDay = cell.dataset.date === selectedCalendarDay ? null : cell.dataset.date;
      renderRdvCalendar(container);
    };
  });

  const detailEl = document.getElementById('calDayDetail');
  if(selectedCalendarDay){ renderRdvItems(detailEl, byDay[selectedCalendarDay] || []); }
  else { detailEl.innerHTML = ''; }
}

function renderInboxList(){
  const el = document.getElementById('inboxList');
  if(inboxTab === 'messages'){
    let items = INBOX.messages;
    if(inboxMsgFilter === 'unread') items = items.filter(m => !m.is_read);
    else if(inboxMsgFilter === 'read') items = items.filter(m => m.is_read);
    items = items.filter(m => matchesInboxSearch([m.name, m.contact, m.message, m.properties?.ref, m.properties?.commune]));
    if(!items.length){
      el.innerHTML = `<div class="inbox-empty">${INBOX.messages.length ? 'Aucun message ne correspond à votre recherche.' : 'Aucun message pour l’instant.'}</div>`;
      return;
    }
    el.innerHTML = items.map(m => `
      <div class="inbox-item ${!m.is_read?'unread':''}" data-id="${m.id}">
        <div class="ii-top"><span class="ii-name">${esc(m.name)}</span><span class="ii-date">${fmtDate(m.created_at)}</span></div>
        <div class="ii-contact">${esc(m.contact)}</div>
        ${m.properties ? `<div class="ii-ref">Bien : ${esc(m.properties.ref)} — ${m.properties.type}, ${esc(m.properties.commune)}</div>` : ''}
        <div class="ii-body">${esc(m.message)}</div>
        <div class="ii-actions">
          <button data-action="toggle-read">${m.is_read?'Marquer non lu':'Marquer lu'}</button>
          <button data-action="delete">Supprimer</button>
        </div>
      </div>`).join('');
    el.querySelectorAll('[data-action="toggle-read"]').forEach(btn=>{
      btn.onclick = async (e) => {
        const id = e.target.closest('.inbox-item').dataset.id;
        const m = INBOX.messages.find(x=>String(x.id)===id);
        await db.from('contact_messages').update({ is_read: !m.is_read }).eq('id', id);
        m.is_read = !m.is_read;
        renderInboxList(); loadInboxCounts();
      };
    });
    el.querySelectorAll('[data-action="delete"]').forEach(btn=>{
      btn.onclick = async (e) => {
        const id = e.target.closest('.inbox-item').dataset.id;
        if(!confirm('Supprimer ce message ?')) return;
        await db.from('contact_messages').delete().eq('id', id);
        INBOX.messages = INBOX.messages.filter(x=>String(x.id)!==id);
        renderInboxList(); loadInboxCounts();
      };
    });
  } else if(inboxTab === 'rdv'){
    rdvFilteredItems = INBOX.appointments
      .filter(a => inboxRdvFilter === 'all' || a.status === inboxRdvFilter)
      .filter(a => matchesInboxSearch([a.name, a.contact, a.message, a.properties?.ref, a.properties?.commune]));
    el.innerHTML = `
      <div class="rdv-view-toggle" style="margin-bottom:12px;">
        <button data-rdvview="list" class="${rdvView==='list'?'active':''}">Liste</button>
        <button data-rdvview="calendar" class="${rdvView==='calendar'?'active':''}">Calendrier</button>
      </div>
      <div id="rdvContent"></div>`;
    el.querySelectorAll('[data-rdvview]').forEach(btn=>{
      btn.onclick = () => { rdvView = btn.dataset.rdvview; renderInboxList(); };
    });
    const content = document.getElementById('rdvContent');
    if(rdvView === 'calendar'){ renderRdvCalendar(content); }
    else { renderRdvItems(content, rdvFilteredItems); }
  } else {
    const items = INBOX.alerts.filter(a => matchesInboxSearch([a.email, a.type, a.operation, a.region]));
    if(!items.length){
      el.innerHTML = `<div class="inbox-empty">${INBOX.alerts.length ? 'Aucune alerte ne correspond à votre recherche.' : 'Aucune inscription aux alertes.'}</div>`;
      return;
    }
    el.innerHTML = items.map(a => `
      <div class="inbox-item" data-id="${a.id}">
        <div class="ii-top"><span class="ii-name">${esc(a.email)}</span><span class="ii-date">${fmtDate(a.created_at)}</span></div>
        <div class="ii-body">${esc([a.type, a.operation, a.region].filter(Boolean).join(' · ') || 'Tous types')}${a.budget_max ? ' · max ' + Number(a.budget_max).toLocaleString('fr-FR') + ' FCFA' : ''}</div>
        <div class="ii-actions"><button data-action="delete">Supprimer</button></div>
      </div>`).join('');
    el.querySelectorAll('[data-action="delete"]').forEach(btn=>{
      btn.onclick = async (e) => {
        const id = e.target.closest('.inbox-item').dataset.id;
        if(!confirm('Supprimer cette inscription ?')) return;
        await db.from('alert_subscriptions').delete().eq('id', id);
        INBOX.alerts = INBOX.alerts.filter(x=>String(x.id)!==id);
        renderInboxList(); loadInboxCounts();
      };
    });
  }
}

// Aucun des tiroirs (réception, journal, agences, prospects, avis, formulaire
// de bien) ni le panneau statistiques ne se fermaient au clavier, et rien
// n'empêchait Tab de s'en échapper vers la page masquée derrière — même
// défaut que celui trouvé et corrigé sur le tiroir de fiche de la vitrine.
// Élément qui avait le focus avant l'ouverture : on l'y ramène à la fermeture.
let _elementAvantPanneauAdmin = null;
function focoliserPanneauAdmin(panneauId){
  _elementAvantPanneauAdmin = document.activeElement;
  const panneau = document.getElementById(panneauId);
  const cible = panneau && panneau.querySelector('.drawer-close, .analytics-close');
  if(cible) cible.focus();
}
function rendreFocusApresPanneauAdmin(){
  if(_elementAvantPanneauAdmin){ _elementAvantPanneauAdmin.focus(); _elementAvantPanneauAdmin = null; }
}
function panneauAdminOuvert(){
  const analytics = document.getElementById('analyticsOverlay');
  return document.querySelector('.drawer.open')
    || (analytics && !analytics.classList.contains('hidden') ? analytics : null);
}
document.addEventListener('keydown', e => {
  const panneau = panneauAdminOuvert();
  if(!panneau) return;
  if(e.key === 'Escape'){ panneau.querySelector('.drawer-close, .analytics-close')?.click(); return; }
  if(e.key !== 'Tab') return;
  const focusables = [...panneau.querySelectorAll('a[href], button:not([disabled]), input:not([disabled]), select:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex="-1"])')]
    .filter(el => el.offsetParent !== null);
  if(!focusables.length) return;
  const premier = focusables[0], dernier = focusables[focusables.length - 1];
  if(e.shiftKey && document.activeElement === premier){ e.preventDefault(); dernier.focus(); }
  else if(!e.shiftKey && document.activeElement === dernier){ e.preventDefault(); premier.focus(); }
});

// ============================================================
// JOURNAL D'ACTIVITÉ
// ============================================================
// La table activity_logs est alimentée par un déclencheur en base
// (log_property_activity), pas par cette page : le journal enregistre donc
// aussi ce qui est fait hors interface, par exemple depuis la console
// Supabase. Sa lecture est réservée à l'admin par les règles de sécurité.

const JOURNAL_PAR_PAGE = 25;
let JOURNAL_ROWS = [];
let journalFiltre = 'Tous';
let journalPage = 1;

// Libellé, couleur et icône de chaque type d'événement enregistré par le
// déclencheur. Un type inconnu (ajouté plus tard en base) reste affiché
// tel quel plutôt que d'être ignoré silencieusement.
const JOURNAL_ACTIONS = {
  create_property:          { label:'Bien créé',            couleur:'#2F7A4E', icone:'+' },
  update_property:          { label:'Bien modifié',         couleur:'#5A6B84', icone:'✎' },
  update_status:            { label:'Statut changé',        couleur:'#C8871A', icone:'⇄' },
  archive_property:         { label:'Bien archivé',         couleur:'#8B9199', icone:'▤' },
  restore_property:         { label:'Bien restauré',        couleur:'#1F7A73', icone:'↺' },
  delete_property_permanent:{ label:'Suppression définitive',couleur:'#C4432F', icone:'✕' }
};

function journalActionInfo(action){
  return JOURNAL_ACTIONS[action] || { label: action, couleur:'#5A6B84', icone:'•' };
}

function journalActeur(actorId){
  if(!actorId) return 'Système';           // modification hors session (SQL, migration)
  if(actorId === ADMIN_ID) return 'Vous';
  return COLLABORATORS[actorId] || 'Collaborateur (non nommé)';
}

// Date lisible : l'heure exacte compte dans un journal d'audit.
function journalDate(iso){
  const d = new Date(iso);
  const auj = new Date();
  const memeJour = d.toDateString() === auj.toDateString();
  const heure = d.toLocaleTimeString('fr-FR', { hour:'2-digit', minute:'2-digit' });
  if(memeJour) return `Aujourd'hui à ${heure}`;
  return d.toLocaleDateString('fr-FR', { day:'2-digit', month:'short', year:'numeric' }) + ` à ${heure}`;
}

async function loadJournalData(){
  const { data, error } = await db.from('activity_logs')
    .select('id, actor_id, action, entity_type, entity_id, details, created_at')
    .order('created_at', { ascending:false })
    .limit(500);
  if(error){ JOURNAL_ROWS = null; return; }
  JOURNAL_ROWS = data || [];
}

function renderJournal(){
  const d = document.getElementById('journalDrawer');

  if(JOURNAL_ROWS === null){
    d.innerHTML = `
      <div class="inbox-tabs"><strong style="font-family:'Manrope',sans-serif;font-size:17px;">Journal d'activité</strong></div>
      <div class="inbox-empty">Lecture du journal impossible. Cette page est réservée à l'administrateur.</div>`;
    return;
  }

  const lignes = journalFiltre === 'Tous'
    ? JOURNAL_ROWS
    : JOURNAL_ROWS.filter(r => r.action === journalFiltre);

  const totalPages = Math.max(1, Math.ceil(lignes.length / JOURNAL_PAR_PAGE));
  journalPage = Math.min(Math.max(1, journalPage), totalPages);
  const debut = (journalPage - 1) * JOURNAL_PAR_PAGE;
  const page = lignes.slice(debut, debut + JOURNAL_PAR_PAGE);

  // On ne propose que les filtres réellement présents dans le journal.
  const presentes = [...new Set(JOURNAL_ROWS.map(r => r.action))];

  d.innerHTML = `
    <div class="journal-tete">
      <div>
        <strong>Journal d'activité</strong>
        <p>${JOURNAL_ROWS.length} événement${JOURNAL_ROWS.length>1?'s':''} enregistré${JOURNAL_ROWS.length>1?'s':''}</p>
      </div>
      <button type="button" class="drawer-close" id="journalClose" aria-label="Fermer">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg>
      </button>
    </div>

    <div class="journal-filtres">
      <button type="button" class="chip ${journalFiltre==='Tous'?'active':''}" data-journal-filtre="Tous">Tout <span class="count">${JOURNAL_ROWS.length}</span></button>
      ${presentes.map(a=>{
        const info = journalActionInfo(a);
        const n = JOURNAL_ROWS.filter(r=>r.action===a).length;
        return `<button type="button" class="chip ${journalFiltre===a?'active':''}" data-journal-filtre="${esc(a)}">${esc(info.label)} <span class="count">${n}</span></button>`;
      }).join('')}
    </div>

    ${lignes.length === 0 ? `<div class="inbox-empty">Aucun événement pour ce filtre.</div>` : `
      <div class="journal-liste">
        ${page.map(r=>{
          const info = journalActionInfo(r.action);
          const det = r.details || {};
          const ref = det.ref ? esc(det.ref) : null;
          // Le bien peut avoir été supprimé depuis : la référence conservée
          // dans details reste lisible même quand la fiche n'existe plus.
          const existe = ref && PROPERTIES.some(p => String(p.id) === String(r.entity_id));
          const changement = (det.old_status || det.new_status)
            ? `<span class="journal-transition">${esc(det.old_status || '—')} <span aria-hidden="true">→</span> ${esc(det.new_status || '—')}</span>` : '';
          return `
            <div class="journal-item">
              <span class="journal-puce" style="background:${info.couleur}1F;color:${info.couleur};" aria-hidden="true">${info.icone}</span>
              <div class="journal-corps">
                <div class="journal-ligne1">
                  <strong>${esc(info.label)}</strong>
                  ${ref ? (existe
                      ? `<button type="button" class="journal-ref" data-journal-bien="${esc(String(r.entity_id))}">${ref}</button>`
                      : `<span class="journal-ref journal-ref-morte" title="Ce bien n'existe plus">${ref}</span>`) : ''}
                </div>
                ${changement}
                <div class="journal-meta">${esc(journalActeur(r.actor_id))} · ${esc(journalDate(r.created_at))}</div>
              </div>
            </div>`;
        }).join('')}
        ${totalPages > 1 ? `
          <nav class="list-pager" aria-label="Pagination du journal">
            <button type="button" class="pager-btn" data-journal-page="-1" ${journalPage===1?'disabled':''}>‹ Précédent</button>
            <span class="pager-status">Page ${journalPage} sur ${totalPages}<small>${debut+1}–${debut+page.length} sur ${lignes.length}</small></span>
            <button type="button" class="pager-btn" data-journal-page="1" ${journalPage===totalPages?'disabled':''}>Suivant ›</button>
          </nav>` : ''}
      </div>`}
  `;

  document.getElementById('journalClose').onclick = closeJournal;
  d.querySelectorAll('[data-journal-filtre]').forEach(b=>{
    b.onclick = () => { journalFiltre = b.dataset.journalFiltre; journalPage = 1; renderJournal(); };
  });
  d.querySelectorAll('[data-journal-page]').forEach(b=>{
    b.onclick = () => { journalPage += Number(b.dataset.journalPage); renderJournal(); d.scrollTop = 0; };
  });
  d.querySelectorAll('[data-journal-bien]').forEach(b=>{
    b.onclick = () => {
      const p = PROPERTIES.find(x => String(x.id) === String(b.dataset.journalBien));
      if(p){ closeJournal(); openDrawer(p); }
    };
  });
}

  document.getElementById('journalOverlay').classList.remove('open');

// ============================================================
// SURVEILLANCE DES ENVOIS D'EMAIL
// ============================================================
// Une panne d'envoi ne se voit pas : le prospect est bien enregistré, mais
// personne ne reçoit rien. On s'en apercevait en remarquant une absence —
// la chose la plus difficile à remarquer. Les fonctions Edge consignent
// désormais chaque envoi ; il reste à rendre le silence audible.

async function checkNotificationHealth(){
  const bandeau = document.getElementById('panneEnvoi');
  if(!bandeau) return;
  const { data, error } = await db.from('notification_health').select('*').maybeSingle();
  // Un collaborateur n'a pas accès au journal : pas d'alerte, pas de bruit.
  if(error || !data || !data.echecs_7j){ bandeau.classList.add('hidden'); return; }

  // Le bandeau doit refléter l'état ACTUEL, pas une cicatrice. Si un envoi a
  // réussi APRÈS le dernier échec, c'est que la panne est passée : on ne
  // laisse pas l'alarme sonner sept jours de plus pour un incident déjà résolu.
  // Sans cette règle, chaque échec, même isolé et suivi de succès, gardait le
  // bandeau affiché jusqu'à sortir de la fenêtre de sept jours.
  const retabli = data.dernier_envoi_reussi && data.dernier_echec
    && new Date(data.dernier_envoi_reussi) >= new Date(data.dernier_echec);
  if(retabli){ bandeau.classList.add('hidden'); return; }

  const quand = data.dernier_echec
    ? new Date(data.dernier_echec).toLocaleString('fr-FR', {day:'2-digit', month:'long', hour:'2-digit', minute:'2-digit'})
    : null;
  // Panne installée, ou incident partiel ?
  //
  // Le test portait sur envois_7j, qui compte les LOTS entièrement réussis. Un
  // lot où quatre emails sur six étaient partis y valait zéro, et le bandeau
  // annonçait « les emails ne partent plus » à quelqu'un dont quatre inscrits
  // venaient d'être prévenus. Le vrai critère est le nombre d'emails délivrés.
  const emailsPartis = Number(data.emails_envoyes_7j || 0);
  const totalement = emailsPartis === 0;

  bandeau.className = 'panne-envoi';
  bandeau.innerHTML = `
    <span class="panne-ico" aria-hidden="true">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 9v4"/><path d="M12 17h.01"/><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg>
    </span>
    <div class="panne-txt">
      <strong>${totalement
        ? 'Les emails de notification ne partent plus'
        : `Des emails de notification n’arrivent pas`}</strong>
      <span>
        ${totalement
          ? 'Aucun email n’est parti depuis 7 jours. Les demandes de vos prospects sont bien enregistrées et visibles dans la boîte de réception, mais vous n’êtes plus prévenu par email.'
          : `${emailsPartis} email${emailsPartis>1?'s sont partis':' est parti'} cette semaine, mais ${data.echecs_7j} envoi${data.echecs_7j>1?'s ont':' a'} partiellement échoué : certains inscrits n’ont rien reçu. Les demandes restent enregistrées.`}
        ${quand ? `<br>Dernier échec : ${esc(quand)}.` : ''}
        ${data.dernier_message ? `<br><code>${esc(String(data.dernier_message).slice(0,160))}</code>` : ''}
      </span>
      <span class="panne-quoi-faire">${totalement
        ? 'À vérifier : la clé Resend (expirée ou révoquée) dans les secrets de vos fonctions Supabase.'
        : 'Cause la plus probable : la limite de débit de Resend, deux envois par seconde sur l’offre gratuite. Les emails partent aujourd’hui en rafale, sans attente entre deux.'}</span>
    </div>`;
}

// ============================================================
// AGENCES
// ============================================================
// Décision métier : un collaborateur EST une agence. La certification est
// réservée à l'admin — une agence qui se certifie elle-même rendrait le
// badge sans valeur. Le refus vient de la base, pas d'un test ici.

let AGENCES = [];

// Les candidatures d'agences vivent dans leur propre table : une candidature
// n'est pas un message de contact, et l'y mêler créerait une fiche prospect
// pour chaque agence candidate.
let CANDIDATURES = [];
const ETATS_CANDIDATURE = ['Nouvelle', 'En discussion', 'Acceptée', 'Refusée'];

async function loadAgences(){
  // On lit d'abord la vue enrichie (coordonnées + compte activé ou non). Si
  // elle n'existe pas encore — migration pas jouée —, on retombe sur la table
  // seule plutôt que d'afficher un écran vide : l'admin garde son outil.
  let vue = await db.from('collaborators_etat')
    .select('user_id, display_name, contact_name, phone, email, zone, verified_at, invited_at, created_at, compte_active')
    .order('display_name');

  if(vue.error){
    vue = await db.from('collaborators')
      .select('user_id, display_name, verified_at, created_at')
      .order('display_name');
  }

  const { data: cand } = await db.from('collaborator_requests')
    .select('*').order('created_at', { ascending:false });

  AGENCES = vue.error ? null : (vue.data || []);
  CANDIDATURES = cand || [];
}

// Ouvre un compte pour une agence et lui envoie son lien d'activation.
// L'appel passe par une fonction serveur : créer un compte exige la clé de
// service Supabase, qui ne peut pas vivre dans le code de cette page.
async function inviterAgence(champs, bouton, messageEl){
  messageEl.textContent = '';
  messageEl.style.color = '';

  if(!champs.display_name || !champs.email){
    messageEl.textContent = "Le nom de l'agence et l'email sont obligatoires.";
    messageEl.style.color = 'var(--danger)';
    return false;
  }

  const { data: session } = await db.auth.getSession();
  const jeton = session && session.session ? session.session.access_token : null;
  if(!jeton){
    messageEl.textContent = "Session expirée : reconnectez-vous avant d'inviter une agence.";
    messageEl.style.color = 'var(--danger)';
    return false;
  }

  const libelle = bouton.textContent;
  bouton.disabled = true; bouton.textContent = 'Envoi…';
  try{
    const res = await fetch(SUPABASE_URL + '/functions/v1/inviter-agence', {
      method: 'POST',
      headers: {
        'Authorization': 'Bearer ' + jeton,
        'Content-Type': 'application/json',
        'apikey': SUPABASE_KEY
      },
      body: JSON.stringify(champs)
    });
    const corps = await res.json().catch(()=>({}));
    if(!res.ok){
      messageEl.textContent = corps.erreur || "L'invitation a échoué.";
      messageEl.style.color = 'var(--danger)';
      return false;
    }
    messageEl.textContent = corps.message || 'Invitation envoyée.';
    messageEl.style.color = 'var(--success)';
    await loadAgences();
    renderAgences();
    return true;
  }catch(e){
    messageEl.textContent = "L'invitation a échoué — vérifiez votre connexion.";
    messageEl.style.color = 'var(--danger)';
    return false;
  }finally{
    bouton.disabled = false; bouton.textContent = libelle;
  }
}

async function setCandidatureStatus(id, statut, champ){
  const avant = (CANDIDATURES.find(c=>c.id === id) || {}).status;
  champ.disabled = true;
  const { error } = await db.from('collaborator_requests').update({ status: statut }).eq('id', id);
  champ.disabled = false;
  if(error){
    // On remet ce qui est réellement en base plutôt que de laisser l'écran
    // afficher un statut qui n'a pas été enregistré.
    champ.value = avant;
    alert("Le statut n'a pas pu être enregistré : " + error.message);
    return;
  }
  await loadAgences();
  renderAgences();
  majBadgeAgences();
}

function majBadgeAgences(){
  const badge = document.getElementById('agencesBadge');
  if(!badge) return;
  const n = CANDIDATURES.filter(c=>c.status === 'Nouvelle').length;
  badge.style.display = n > 0 ? '' : 'none';
  badge.textContent = n;
}

async function setAgenceVerified(userId, verifie){
  const { error } = await db.from('collaborators')
    .update({ verified_at: verifie ? new Date().toISOString() : null })
    .eq('user_id', userId);
  if(error){ alert("La certification a échoué : " + error.message); return; }
  await loadAgences();
  renderAgences();
}

function renderAgences(){

        <div class="form-field"><label class="form-label" for="ag_contact">Personne à joindre</label>
          <input class="form-input" id="ag_contact" autocomplete="name" /></div>
        <div class="form-field"><label class="form-label" for="ag_tel">Téléphone</label>
          <input class="form-input" id="ag_tel" type="tel" autocomplete="tel" placeholder="+221 …" /></div>

        <p class="agence-form-aide">L'agence recevra un lien par email pour choisir elle-même son mot de passe. Vous n'avez aucun mot de passe à créer ni à transmettre.</p>

          <button type="button" class="btn btn-primary" id="agenceInviter">Envoyer l'invitation</button>

    form.classList.toggle('hidden', !ouvrir);
    btnOuvrir.setAttribute('aria-expanded', ouvrir ? 'true' : 'false');
    if(ouvrir) document.getElementById('ag_nom').focus();
  };
  btnOuvrir.onclick = () => basculer(form.classList.contains('hidden'));
  document.getElementById('agenceAnnuler').onclick = () => { basculer(false); msg.textContent=''; btnOuvrir.focus(); };

  document.getElementById('agenceInviter').onclick = async (e) => {
    const ok = await inviterAgence({
      display_name: val('ag_nom'),
      email: val('ag_email'),
      contact_name: val('ag_contact'),
      phone: val('ag_tel'),
      zone: val('ag_zone')
    }, e.currentTarget, msg);
    // renderAgences() a déjà tout reconstruit en cas de succès : inutile de
    // vider les champs d'un formulaire qui n'existe plus.
    if(!ok) return;

  // Créer le compte directement depuis une candidature : les coordonnées sont
  // déjà là, les retaper serait une source d'erreur.
  d.querySelectorAll('[data-ouvrir-compte]').forEach(b=>{

      document.getElementById('ag_tel').value   = estEmail ? '' : contact;
      document.getElementById('ag_contact').value = c.contact_name || '';
      document.getElementById('ag_zone').value  = c.zone || '';
      document.getElementById(estEmail ? 'ag_contact' : 'ag_email').focus();
      form.scrollIntoView({ behavior:'smooth', block:'nearest' });
    };
  });
}

async function setReviewStatus(id, statut, champ){
  const avant = (AVIS.find(a => a.id === id) || {}).status;

    return;
  }
  await loadAvis();
  renderAvis();
  majBadgeAvis();
}

// ============================================================
// MENU DÉROULANT DES OUTILS
// ============================================================
// Regroupe les fonctions de gestion pour désencombrer l'en-tête. Les boutons
// ont gardé leurs identifiants : leurs gestionnaires (openProspects, openAvis…)
// sont déjà branchés ailleurs. Ici on ne gère que l'ouverture du menu et sa
// pastille combinée.
(function initToolsMenu(){
  const trigger = document.getElementById('toolsMenuBtn');
  const menu = document.getElementById('toolsMenu');

  function ouvrir(v){
    menu.hidden = !v;
    trigger.setAttribute('aria-expanded', String(v));
  }
  trigger.addEventListener('click', e => { e.stopPropagation(); ouvrir(menu.hidden); });
  // Choisir une entrée ouvre son tiroir (via son propre gestionnaire) puis
  // referme le menu.
  menu.addEventListener('click', () => ouvrir(false));
  // Un clic ailleurs, ou Échap, referme.
  document.addEventListener('click', e => {
    if(!menu.hidden && !menu.contains(e.target) && e.target !== trigger) ouvrir(false);
  });
  document.addEventListener('keydown', e => { if(e.key === 'Escape') ouvrir(false); });

  // Pastille du menu = somme des pastilles visibles des outils. On observe les
  // pastilles individuelles plutôt que de modifier chaque fonction majBadge*.
  const badges = ['agencesBadge', 'avisBadge'];
  window.refreshMenuBadge = function(){
    let total = 0;
    badges.forEach(id => {
      const b = document.getElementById(id);
      if(b && b.style.display !== 'none') total += parseInt(b.textContent, 10) || 0;
    });
    const m = document.getElementById('toolsMenuBadge');
    m.style.display = total > 0 ? '' : 'none';
    m.textContent = total;
  };
  badges.forEach(id => {
    const b = document.getElementById(id);
    if(b) new MutationObserver(window.refreshMenuBadge)
      .observe(b, { attributes:true, attributeFilter:['style'], childList:true, characterData:true, subtree:true });
  });
  window.refreshMenuBadge();
})();

// ============================================================
// PROSPECTS
// ============================================================
// La boîte de réception montre les sollicitations ; celle-ci montre les
// PERSONNES. Vingt messages et rendez-vous venaient de quatre personnes : sans
// ce regroupement, on relance quelqu'un qu'un collègue a déjà appelé, et on
// oublie celui qui n'a écrit qu'une fois.
//
// Le rapprochement se fait en base, par contact_key() : « +221 77 849 41 11 »
// et « 778494111 » désignent la même personne. Le refaire ici en JavaScript
// créerait une seconde vérité qui finirait par diverger de la première.

const ETAPES = ['Nouveau', 'Contacté', 'Visite', 'Négociation', 'Conclu', 'Perdu'];
// Deux semaines sans nouvelles : au-delà, un dossier en cours a besoin d'une
// relance. C'est le même seuil que celui du calcul en base.
const RELANCE_JOURS = 14;

let PROSPECTS = [];
let statsProspects = null;

async function loadProspects(){
  const [{ data: fiches, error: e1 }, { data: stats }] = await Promise.all([
    db.from('leads_enrichis').select('*').order('last_activity_at', { ascending:false }),
    db.rpc('stats_prospects')
  ]);
  if(e1){ PROSPECTS = []; statsProspects = null; return e1; }
  PROSPECTS = fiches || [];
  // La fonction renvoie une ligne unique ; PostgREST la présente en tableau.
  statsProspects = Array.isArray(stats) ? stats[0] : stats;
  return null;
}

function prospectFaits(p){
  const faits = [];
  if(p.nb_messages) faits.push(`${p.nb_messages} message${p.nb_messages>1?'s':''}`);
  if(p.nb_rdv) faits.push(`${p.nb_rdv} rendez-vous`);
  if(p.nb_visites_realisees) faits.push(`${p.nb_visites_realisees} visite${p.nb_visites_realisees>1?'s':''} réalisée${p.nb_visites_realisees>1?'s':''}`);
  if(p.property_ref) faits.push(`${p.property_type} · ${p.property_commune}`);
  // Prospect vendeur : son bien n'existe pas encore au catalogue (pas de
  // property_ref), il vient de estimer_bien() via seller_estimates.
  if(p.estimation_commune){
    const montant = (p.estimation_basse && p.estimation_haute)
      ? `${fcfa(p.estimation_basse)} – ${fcfa(p.estimation_haute)}`
      : 'estimation non concluante';
    faits.push(`Vendeur — ${p.estimation_type} · ${p.estimation_commune} · ${p.estimation_surface} ${surfaceUnit(p.estimation_type)} · ${montant}`);
  }
  return faits;
}

function renderProspects(){
  const d = document.getElementById('prospectsDrawer');
  const s = statsProspects;

  const carte = (valeur, libelle, alerte) =>
    `<div class="pros-stat${alerte ? ' alerte' : ''}"><b>${valeur}</b><span>${libelle}</span></div>`;

  const entete = `
    <div class="drawer-head">
      <h2>Prospects</h2>
      <button class="drawer-close" id="prospectsClose" aria-label="Fermer">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>`;

  if(!PROSPECTS.length){
    d.innerHTML = entete + `<div class="drawer-body"><p class="pros-vide">Aucun prospect pour l'instant.<br>Les fiches se créent toutes seules dès qu'une personne écrit ou demande une visite.</p></div>`;
    document.getElementById('prospectsClose').onclick = closeProspects;
    return;
  }

  const stats = s ? `
    <div class="pros-stats">
      ${carte(s.total, 'prospects')}
      ${carte(s.en_cours, 'en cours')}
      ${carte(s.conclus, 'conclus')}
      ${carte(s.taux_conversion == null ? '—' : s.taux_conversion + ' %', 'conversion')}
      ${s.a_relancer ? carte(s.a_relancer, 'à relancer', true) : ''}
    </div>
    ${s.taux_conversion == null
      ? '<p style="margin:-8px 0 4px;font-size:11.5px;color:var(--ink-soft);">Le taux apparaîtra dès qu\'un premier dossier sera conclu ou perdu : il se mesure sur les dossiers tranchés, pas sur ceux encore en cours.</p>'
      : ''}` : '';

  // Un prospect par personne, rangé par étape. L'ordre des étapes est celui du
  // parcours réel, pas l'ordre alphabétique.
  const colonnes = ETAPES.map(etape=>{
    const lot = PROSPECTS.filter(p=>p.stage === etape);
    if(!lot.length) return '';
    return `<div class="pros-etape-titre">${etape} · ${lot.length}</div>` + lot.map(p=>{
      const relancer = !['Conclu','Perdu'].includes(p.stage) && p.jours_sans_nouvelles >= RELANCE_JOURS;
      return `
      <div class="pros-item" data-pros="${p.id}">
        <div class="pros-haut">
          <div style="min-width:0;">
            <div class="pros-nom">${esc(p.name)}</div>
            <div class="pros-coord">${esc(p.contact)}</div>
          </div>
          <select class="pros-select" data-etape-de="${p.id}" aria-label="Étape de ${esc(p.name)}">
            ${ETAPES.map(e=>`<option value="${e}"${e===p.stage?' selected':''}>${e}</option>`).join('')}
          </select>
        </div>
        <div class="pros-faits">
          ${prospectFaits(p).map(f=>`<span class="pros-fait">${esc(f)}</span>`).join('')}
          <span class="pros-fait${relancer?' chaud':''}">${
            p.jours_sans_nouvelles === 0 ? "aujourd'hui"
            : p.jours_sans_nouvelles === 1 ? 'hier'
            : `il y a ${p.jours_sans_nouvelles} jours`}</span>
        </div>
        <textarea class="pros-notes" data-notes-de="${p.id}" rows="1"
          placeholder="Notes de suivi — ce qui a été dit, ce qu'il reste à faire">${esc(p.notes || '')}</textarea>
      </div>`;
    }).join('');
  }).join('');

  d.innerHTML = entete + `<div class="drawer-body">${stats}${colonnes}</div>`;
  document.getElementById('prospectsClose').onclick = closeProspects;

  d.querySelectorAll('[data-etape-de]').forEach(sel=>{
    sel.onchange = () => majEtapeProspect(sel.dataset.etapeDe, sel.value, sel);
  });
  d.querySelectorAll('[data-notes-de]').forEach(zone=>{
    // À la sortie du champ, pas à chaque frappe : une écriture par lettre
    // saturerait la base et ferait clignoter l'écran.
    zone.onblur = () => majNotesProspect(zone.dataset.notesDe, zone.value, zone);
  });
}

async function majEtapeProspect(id, etape, champ){
  const prospect = PROSPECTS.find(p=>p.id === id) || {};
  const avant = prospect.stage;
  champ.disabled = true;
  const { error } = await db.from('leads').update({ stage: etape }).eq('id', id);
  champ.disabled = false;
  if(error){
    // On remet ce qui est réellement en base plutôt que de laisser l'écran
    // afficher une étape qui n'a pas été enregistrée.
    champ.value = avant;
    alert("L'étape n'a pas pu être enregistrée : " + error.message);
    return;
  }
  // Le chiffre « clients accompagnés » de la vitrine avance tout seul dès
  // qu'un dossier passe à Conclu (et recule si l'étape est corrigée par
  // erreur), pour ne plus dépendre d'y penser à la main à chaque fois. La
  // remise des clés est aussi le meilleur moment — et le seul qu'on n'oublie
  // jamais — pour solliciter un avis : même déclencheur, une case de plus.
  if(etape === 'Conclu' && avant !== 'Conclu'){
    await ajusterClientsAccompagnes(1);
    proposerDemandeAvis(prospect);
  }
  else if(avant === 'Conclu' && etape !== 'Conclu') await ajusterClientsAccompagnes(-1);
  await loadProspects();
  renderProspects();
  majBadgeProspects();
}

// Un contact de prospect peut être un numéro, mais aussi un e-mail ou une
// fiche de test (« Test », une adresse mail…) : sans ce filtre, on tenterait
// d'ouvrir WhatsApp avec un numéro qui n'en est pas un.
function numeroWhatsapp(contact){
  const chiffres = String(contact || '').replace(/\D/g, '');
  if(chiffres.length < 8 || chiffres.length > 13) return null;
  return chiffres.startsWith('221') ? chiffres : '221' + chiffres.replace(/^0+/, '');
}

// Propose systématiquement une demande d'avis à la conclusion d'un dossier,
// pré-remplie avec le bien concerné — objectif : 15 avis nommés, chacun
// rattaché à une transaction réelle plutôt qu'un « Super agence ! » générique.
// Le lien pointe vers le formulaire public avec le bien pré-rempli
// (voir appliquerAvisDepuisURL dans vitrine.html) ; la personne n'a plus qu'à
// noter et commenter.
function proposerDemandeAvis(prospect){
  const nom = prospect.name || 'ce client';
  const libelle = [prospect.property_type, prospect.property_commune].filter(Boolean).join(' — ');
  const numero = numeroWhatsapp(prospect.contact);
  if(!numero){
    alert(`Dossier conclu pour ${nom} — pensez à lui demander un avis à la main : pas de numéro WhatsApp reconnu dans « ${prospect.contact || '—'} ».`);
    return;
  }
  if(!confirm(`Dossier conclu pour ${nom}${libelle ? ' (' + libelle + ')' : ''}. Ouvrir WhatsApp pour lui demander un avis ?`)) return;
  const lien = new URL('vitrine.html', window.location.href);
  lien.searchParams.set('avis', '1');
  if(prospect.property_ref) lien.searchParams.set('avis_ref', prospect.property_ref);
  if(libelle) lien.searchParams.set('avis_libelle', libelle);
  lien.hash = 'avis';
  const message = `Bonjour ${nom}, merci pour votre confiance ! `
    + (libelle ? `Votre dossier pour ${libelle} vient d'être conclu.` : `Votre dossier vient d'être conclu.`)
    + `\n\nAuriez-vous 2 minutes pour laisser un avis sur votre expérience avec PAB Immo ?\n${lien.toString()}`;
  window.open(`https://wa.me/${numero}?text=${encodeURIComponent(message)}`, '_blank', 'noopener');
}

async function ajusterClientsAccompagnes(delta){
  const { data: reglage } = await db.from('site_settings')
    .select('value').eq('key','clients_accompagnes').maybeSingle();
  const actuel = reglage && reglage.value != null ? Number(reglage.value) : 0;
  const suivant = Math.max(0, actuel + delta);
  await db.from('site_settings').upsert({ key:'clients_accompagnes', value: suivant }, { onConflict:'key' });
}

async function majNotesProspect(id, notes, champ){
  const fiche = PROSPECTS.find(p=>p.id === id);
  if(!fiche || (fiche.notes || '') === notes) return;   // rien n'a changé
  const { error } = await db.from('leads').update({ notes: notes || null }).eq('id', id);
  if(error){
    champ.value = fiche.notes || '';
    alert("La note n'a pas pu être enregistrée : " + error.message);
    return;
  }
  fiche.notes = notes;
}

let analyticsCharts = [];

function lastNMonths(n){
  const out = [];
  const base = new Date(); base.setDate(1);
  for(let i=n-1;i>=0;i--){
    const dt = new Date(base.getFullYear(), base.getMonth()-i, 1);
    out.push({
      key: dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0'),
      label: dt.toLocaleDateString('fr-FR', {month:'short', year:'2-digit'})
    });
  }
  return out;
}
function countByMonth(rows, dateField){
  const map = {};
  (rows||[]).forEach(r=>{
    const v = r[dateField];
    if(!v) return;
    const k = v.slice(0,7);
    map[k] = (map[k]||0)+1;
  });
  return map;
}

async function loadAnalyticsData(){
  const [
    { data: visitRows },
    { data: viewRows },
    { data: favRows },
    { data: msgRows },
    { data: rdvRows },
    { data: statusHistory }
  ] = await Promise.all([
    db.from('site_visits').select('session_id'),
    db.from('property_views').select('property_id'),
    db.from('favorite_events').select('property_id').eq('action','add'),
    db.from('contact_messages').select('id, created_at'),
    db.from('appointments').select('id, created_at, status, preferred_date'),
    db.from('property_status_history').select('property_id, new_status, changed_at')
  ]);
  // Chaque requête ci-dessus est filtrée par les règles de sécurité de la
  // base : l'admin voit tout, un collaborateur ne voit que ce qui touche à
  // ses propres biens. Aucun filtrage n'est fait ici, ce serait redondant et
  // surtout contournable.

  const viewsByProperty = {};
  (viewRows||[]).forEach(r=>{ viewsByProperty[r.property_id] = (viewsByProperty[r.property_id]||0)+1; });
  const favByProperty = {};
  (favRows||[]).forEach(r=>{ favByProperty[r.property_id] = (favByProperty[r.property_id]||0)+1; });

  const uniqueVisitors = new Set((visitRows||[]).map(r=>r.session_id)).size;
  const totalViews = (viewRows||[]).length;
  const totalFavAdds = (favRows||[]).length;
  const totalMsg = (msgRows||[]).length;
  const totalRdv = (rdvRows||[]).length;
  // Plafonné à 100 % : les messages/RDV historiques (antérieurs au suivi des
  // visiteurs) peuvent gonfler le ratio au-delà de 100 %, ce qui n'aurait pas de sens.
  const conversionRate = uniqueVisitors > 0 ? Math.min(100, Math.round(((totalMsg+totalRdv)/uniqueVisitors)*1000)/10) : 0;

  // Contacts générés : toute prise de contact, message ou demande de visite.
  const totalContacts = totalMsg + totalRdv;
  // Visites réalisées : la visite a effectivement eu lieu. C'est un fait
  // constaté, pas une intention — à ne pas confondre avec les rendez-vous
  // confirmés, qui ne sont encore que des promesses.
  const visitesRealisees  = (rdvRows||[]).filter(r => r.status === 'Réalisée').length;
  const visitesPlanifiees = (rdvRows||[]).filter(r => r.status === 'Confirmé').length;
  const rdvAnnules        = (rdvRows||[]).filter(r => r.status === 'Annulé').length;
  // Rendez-vous confirmés dont la date est passée : ni réalisés ni annulés,
  // donc en attente d'un constat. Ils faussent les chiffres tant qu'ils
  // traînent, d'où le rappel affiché sous les indicateurs.
  const aujourdhui = new Date().toISOString().slice(0,10);
  const aRequalifier = (rdvRows||[]).filter(r => r.status === 'Confirmé'
                                             && r.preferred_date && r.preferred_date < aujourdhui).length;
  // Conversion des prospects : part des contacts qui aboutissent à une visite
  // réellement effectuée. Indicateur provisoire — un vrai suivi d'affaire
  // (contacté, négociation, gagné/perdu) donnera mieux.
  const prospectRate = totalContacts > 0 ? Math.round((visitesRealisees / totalContacts) * 1000) / 10 : 0;

  const salesByMonth = {}, rentalsByMonth = {};
  (statusHistory||[]).forEach(h=>{
    if(!h.changed_at) return;
    const k = h.changed_at.slice(0,7);
    if(h.new_status === 'Vendu') salesByMonth[k] = (salesByMonth[k]||0)+1;
    if(h.new_status === 'Loué') rentalsByMonth[k] = (rentalsByMonth[k]||0)+1;
  });
  const msgByMonth = countByMonth(msgRows, 'created_at');
  const rdvByMonth = countByMonth(rdvRows, 'created_at');

  const byRegion = {}, byCollaborator = {};
  PROPERTIES.filter(p=>!p.archived_at).forEach(p=>{
    byRegion[p.region] = (byRegion[p.region]||0)+1;
    const label = ownerLabel(p.owner_id);
    byCollaborator[label] = (byCollaborator[label]||0)+1;
  });

  // Nombre d'agences actives : réservé à l'admin, et faute de notion d'agence
  // dans la base, on compte les collaborateurs ayant au moins un bien non
  // archivé. À revoir le jour où une vraie table d'agences existera.
  const agencesActives = IS_ADMIN
    ? new Set(PROPERTIES.filter(p=>!p.archived_at).map(p=>p.owner_id)).size
    : null;

  // Chiffre affiché sur la vitrine : avance tout seul à chaque dossier conclu,
  // mais reste modifiable à la main (correction, clients accompagnés hors
  // suivi prospects). Réservé à l'admin : la table des réglages lui est
  // fermée, inutile d'interroger pour rien.
  let clientsAccompagnes = null;
  if(IS_ADMIN){
    const { data: reglage } = await db.from('site_settings')
      .select('value').eq('key','clients_accompagnes').maybeSingle();
    if(reglage && reglage.value != null) clientsAccompagnes = Number(reglage.value);
  }

  return {
    uniqueVisitors, totalViews, totalFavAdds, totalMsg, totalRdv, conversionRate,
    totalContacts, visitesRealisees, visitesPlanifiees, rdvAnnules, aRequalifier, prospectRate, agencesActives, clientsAccompagnes,
    salesByMonth, rentalsByMonth, msgByMonth, rdvByMonth,
    byRegion, byCollaborator, viewsByProperty, favByProperty
  };
}

function topPropertiesList(counts, emptyLabel){
  const entries = Object.entries(counts).sort((a,b)=>b[1]-a[1]).slice(0,5);
  if(!entries.length) return `<div class="analytics-empty">${emptyLabel}</div>`;
  return `<div class="top-list">${entries.map(([id,count],i)=>{
    const p = PROPERTIES.find(x=>String(x.id)===String(id));
    const label = p ? `${esc(p.ref)} — ${esc(p.type)}, ${esc(p.commune)}` : 'Bien supprimé';
    return `<div class="top-list-item"><span class="top-list-rank">${i+1}</span><span class="top-list-label">${label}</span><span class="top-list-count">${count}</span></div>`;
  }).join('')}</div>`;
}

// Palette des graphiques alignée sur le thème (vert profond / or) — valeurs
// de présentation uniquement, la logique des graphiques est inchangée.
// Alignées sur les jetons de commun.css : les graphiques appartiennent à la
// même palette que le reste, sinon l'écran des statistiques donne l'impression
// d'un autre logiciel.
const CHART_COLORS = { primary:'#0F2747', success:'#397042', warning:'#F2AE05', danger:'#C4432F', ink:'#111827', soft:'#5A6B84', border:'#E4E9F2' };

// Chargement résilient de Chart.js : si le CDN principal a échoué (script blanc,
// blocage réseau, URL obsolète), on tente d'autres sources avant d'abandonner.
// C'est ce qui empêchait les graphiques de s'afficher (Chart était introuvable).
function loadScriptOnce(src){
  return new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = src; s.async = true;
    s.onload = () => resolve(src);
    s.onerror = () => reject(new Error('Échec de chargement : ' + src));
    document.head.appendChild(s);
  });
}
async function ensureChartJs(){
  if(typeof Chart !== 'undefined') return true;
  const sources = [
    'https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js',
    'https://unpkg.com/chart.js@4.4.4/dist/chart.umd.js',
    'https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js'
  ];
  for(const src of sources){
    try{ await loadScriptOnce(src); if(typeof Chart !== 'undefined') return true; }
    catch(e){ /* source suivante */ }
  }
  return typeof Chart !== 'undefined';
}

  mk('chartRegion', { type:'bar', data:{ labels:regionEntries.map(e=>e[0]), datasets:[{ label:'Biens', data:regionEntries.map(e=>e[1]), backgroundColor:CHART_COLORS.primary }] }, options:{ indexAxis:'y', plugins:{legend:{display:false}}, scales:{x:{beginAtZero:true, ticks:{precision:0}}} } });

  const collabEntries = Object.entries(d.byCollaborator).sort((a,b)=>b[1]-a[1]);
  mk('chartCollab', { type:'bar', data:{ labels:collabEntries.map(e=>e[0]), datasets:[{ label:'Biens ajoutés', data:collabEntries.map(e=>e[1]), backgroundColor:CHART_COLORS.success }] }, options:{ indexAxis:'y', plugins:{legend:{display:false}}, scales:{x:{beginAtZero:true, ticks:{precision:0}}} } });
}

async function openAnalytics(){
  const overlay = document.getElementById('analyticsOverlay');
  overlay.classList.remove('hidden');
  overlay.innerHTML = `
    <div class="analytics-header">
      <div><h2>Statistiques</h2><p>${IS_ADMIN ? "Vue d'ensemble de l'activité" : 'Vos biens uniquement'} — 6 derniers mois</p></div>
      <button class="analytics-close" id="analyticsCloseBtn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#0F172A" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="analytics-body" id="analyticsBody"><p style="text-align:center;color:var(--ink-soft);padding:60px 0;">Chargement des statistiques…</p></div>
  `;
  document.getElementById('analyticsCloseBtn').onclick = closeAnalytics;
  focoliserPanneauAdmin('analyticsOverlay');
  const data = await loadAnalyticsData();
  await ensureChartJs();
  renderAnalytics(data);
}
function closeAnalytics(){
  document.getElementById('analyticsOverlay').classList.add('hidden');
  analyticsCharts.forEach(c=>c.destroy());
  analyticsCharts = [];
  rendreFocusApresPanneauAdmin();
}
document.getElementById('analyticsBtn').onclick = openAnalytics;

// ---- Rendu global ----
function render(){
  // Tout changement de filtre, de statut ou d'archives passe par ici : on
  // repart de la première page, sinon on peut atterrir sur une page vide.
  state.page = 1;
  renderChips();
  renderList();
  rebuildMarkers(filtered());
}
async function checkAuth(){
  const { data: { session } } = await db.auth.getSession();
  if(session){
    document.getElementById('authOverlay').style.display = 'none';
    const { data: adminCheck } = await db.rpc('is_admin');
    IS_ADMIN = adminCheck === true;
    document.getElementById('inboxBtn').style.display = IS_ADMIN ? '' : 'none';
  // Le journal trace qui a fait quoi sur les biens de tout le monde :
  // il reste reserve a l'admin, comme la regle de lecture en base.
  document.getElementById('journalBtn').style.display = IS_ADMIN ? '' : 'none';
  document.getElementById('agencesBtn').style.display = IS_ADMIN ? '' : 'none';
  document.getElementById('avisBtn').style.display = IS_ADMIN ? '' : 'none';
  // Le suivi des prospects n'est modifiable que par l'admin : afficher le
  // bouton a un collaborateur lui montrerait un ecran ou rien ne repond.
  document.getElementById('prospectsBtn').style.display = IS_ADMIN ? '' : 'none';
  if(IS_ADMIN){
    loadProspects().then(majBadgeProspects);
    loadAgences().then(majBadgeAgences);
    loadAvis().then(majBadgeAvis);
  }
    // Les statistiques sont ouvertes aux collaborateurs : les règles de
  // sécurité de la base restreignent d'elles-mêmes les chiffres à leurs
  // propres biens. La boîte de réception reste réservée à l'admin.
  document.getElementById('analyticsBtn').style.display = '';
    if(IS_ADMIN) await loadCollaborators();
    loadProperties();
    if(IS_ADMIN) loadInboxCounts();
  } else {
    document.getElementById('authOverlay').style.display = 'flex';
  }
}

document.getElementById('authSubmit').onclick = async () => {
  const email = document.getElementById('authEmail').value.trim();
  const password = document.getElementById('authPassword').value;
  const errEl = document.getElementById('authError');
  errEl.textContent = '';
  if(!email || !password){ errEl.textContent = 'Renseignez email et mot de passe.'; return; }
  const { data, error } = await db.auth.signInWithPassword({ email, password });
  if(error){ errEl.textContent = "Connexion refusée : identifiants incorrects."; return; }
  document.getElementById('authOverlay').style.display = 'none';
  const { data: adminCheck } = await db.rpc('is_admin');
  IS_ADMIN = adminCheck === true;
  document.getElementById('inboxBtn').style.display = IS_ADMIN ? '' : 'none';
  // Le journal trace qui a fait quoi sur les biens de tout le monde :
  // il reste reserve a l'admin, comme la regle de lecture en base.
  document.getElementById('journalBtn').style.display = IS_ADMIN ? '' : 'none';
  document.getElementById('agencesBtn').style.display = IS_ADMIN ? '' : 'none';
  document.getElementById('avisBtn').style.display = IS_ADMIN ? '' : 'none';
  // Le suivi des prospects n'est modifiable que par l'admin : afficher le
  // bouton a un collaborateur lui montrerait un ecran ou rien ne repond.
  document.getElementById('prospectsBtn').style.display = IS_ADMIN ? '' : 'none';
  if(IS_ADMIN){
    loadProspects().then(majBadgeProspects);
    loadAgences().then(majBadgeAgences);
    loadAvis().then(majBadgeAvis);
  }
  // Les statistiques sont ouvertes aux collaborateurs : les règles de
  // sécurité de la base restreignent d'elles-mêmes les chiffres à leurs
  // propres biens. La boîte de réception reste réservée à l'admin.
  document.getElementById('analyticsBtn').style.display = '';
  if(IS_ADMIN) await loadCollaborators();
  loadProperties();
  if(IS_ADMIN) loadInboxCounts();
};

document.getElementById('logoutBtn').onclick = async () => {
  await db.auth.signOut();
  location.reload();
};

checkAuth();

// Recherche temporisée : chaque frappe reconstruisait la liste et
// détruisait puis recréait tous les marqueurs Leaflet. Taper « Dakar »
// déclenchait cinq reconstructions complètes. On attend une courte pause
// dans la frappe avant de rendre.
let searchTimer = null;
document.getElementById('search').addEventListener('input', e=>{
  state.search = e.target.value;
  clearTimeout(searchTimer);
  searchTimer = setTimeout(render, 180);
});
document.getElementById('statusFilter').addEventListener('change', e=>{ state.status = e.target.value; render(); });
document.getElementById('archiveToggleBtn').onclick = () => {
  state.showArchived = !state.showArchived;
  state.selected = null;
  const btn = document.getElementById('archiveToggleBtn');
  btn.classList.toggle('btn-primary', state.showArchived);
  btn.classList.toggle('btn-outline', !state.showArchived);
  document.getElementById('archiveToggleLabel').textContent = state.showArchived ? 'Voir les biens actifs' : 'Archives';
  render();
};
document.querySelectorAll('#viewToggle button').forEach(b=>{
  b.onclick = ()=>{
    document.querySelectorAll('#viewToggle button').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
    document.getElementById('split').dataset.view = b.dataset.view;
    if(b.dataset.view==='map' && map) setTimeout(()=>map.invalidateSize(), 100);
  };
});
